name: deploy

# CI on every push/PR; build + deploy to the VPS only on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- CI: lint, typecheck, unit + integration tests (real Postgres) ----
  ci:
    runs-on: ubuntu-latest
    # A newer push supersedes an in-flight CI run.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: indiework
          POSTGRES_PASSWORD: indiework
          POSTGRES_DB: indiework
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U indiework -d indiework"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Integration test (tests/services.int.test.ts) needs a live DB + the
      # server env (src/server/env.ts validates all four at import time).
      DATABASE_URL: postgres://indiework:indiework@localhost:5432/indiework
      ADMIN_EMAIL: ci-test@example.com
      ADMIN_PASSWORD: ci-test
      COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long
      API_TOKEN: ci-token
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Apply schema before the integration test. Run the script directly
      # (the db:migrate script uses --env-file=.env, which doesn't exist in CI).
      - run: node --import tsx src/server/db/migrate.ts
      - run: pnpm test

  # ---- Build the production image and push it to GHCR ----
  build:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Superseding an in-flight build is fine — cancel it.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Switch the VPS to this commit ----
  # The key in DEPLOY_SSH_KEY can do one thing on the VPS: run `indiework-deploy <sha>` (vps/ansible
  # roles/app_deploy). It has no shell and is not root. That script checks the commit is on main,
  # pulls ghcr.io/tungnguyenson/indiework:<sha> (one blob at a time, after a prune: the containerd
  # ingest race and full-disk failures seen here before), restarts app + demo only if the image
  # changed, waits for both to answer, and puts the previous image back if they do not. Log on the
  # host: /var/log/app-deploy/indiework.log. Roll back: re-run this job on an older run, or on the
  # host `sudo /usr/local/sbin/indiework-deploy <sha>`.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Never cancel a deploy mid-flight: queue concurrent deploys instead.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          printf '%s\n' "$GITHUB_TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "ci-indiework@$DEPLOY_HOST" "$GITHUB_SHA"
